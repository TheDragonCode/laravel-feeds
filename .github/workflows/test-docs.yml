name: Test Documentation

on:
    pull_request:
        paths:
            - docs/**
            - src/**
            - .github/workflows/docs.yml
            - .github/workflows/test-docs.yml
    workflow_dispatch:

concurrency:
    group: docs-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Documentation quality gates
        runs-on: ubuntu-latest
        container: mcr.microsoft.com/playwright:v1.62.1-noble
        timeout-minutes: 25
        defaults:
            run:
                working-directory: docs

        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                with:
                    node-version-file: docs/.node-version
                    cache: npm
                    cache-dependency-path: docs/package-lock.json

            -   name: Install dependencies
                run: npm ci

            -   name: Type check
                run: npm run typecheck

            -   name: Build documentation
                run: npm run build

            -   name: Check metadata and SEO
                run: npm run check:seo

            -   name: Run browser, accessibility, and visual tests
                run: npm run test:browser

            -   name: Check performance budgets
                run: npm run test:performance
